# Fly.io — Next.js web app. Deploy: fly deploy --config apps/web/fly.toml --remote-only
app = "zipline-rh-web"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  ENGINE_URL = "https://zipline-rh-engine.fly.dev"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  NEXT_TELEMETRY_DISABLED = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/engine/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
