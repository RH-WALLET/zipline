# Fly.io — engine API + scheduler worker (one app, two process groups).
# Deploy: fly deploy --config services/engine/fly.toml --remote-only
app = "zipline-rh-engine"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # migrations + idempotent bootstrap run once per release, before the new machines start
  release_command = "sh -c 'alembic upgrade head && zl bootstrap'"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  LIVE_TRADING = "false"
  TREASURY_MODE = "simulated"
  DEMO_INITIAL_CASH = "5000"
  HISTORY_CACHE_DIR = "/tmp/history"
  CYCLE_TIME_ET = "16:20"
  EXPLORER_BASE_URL = "https://robinhoodchain.blockscout.com"
  RH_STOCK_TOKEN_API_URL = "https://api.robinhood.com/rhj"
  CASH_TOKEN_ADDRESS = "0x5fc5360D0400a0Fd4f2af552ADD042D716F1d168"
  CASH_TOKEN_SYMBOL = "USDG"

[processes]
  api = "uvicorn zipline_engine.api.app:app --host 0.0.0.0 --port 8000"
  worker = "zl worker"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1024mb"
  processes = ["api", "worker"]
