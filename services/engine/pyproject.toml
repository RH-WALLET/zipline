[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zipline-engine"
version = "0.1.0"
description = "ZIPLINE — deterministic quantitative strategies on zipline-reloaded, one treasury on Robinhood Chain."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.30,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "httpx>=0.27,<1",
  "web3>=7.0,<8",
  "exchange-calendars>=4.5,<5",
  "empyrical-reloaded>=0.5.9",
  "pandas>=2.1,<3",
  "numpy>=1.26",
  "apscheduler>=3.10,<4",
  "sse-starlette>=2.1,<3",
  "typer>=0.12,<1",
  "yfinance>=0.2.40",
  "zipline-reloaded>=3.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5",
  "respx>=0.21",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-requests",
  "pandas-stubs",
]

[project.scripts]
zl = "zipline_engine.cli:app"

[tool.setuptools.packages.find]
include = ["zipline_engine*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "N", "S105", "S106", "S107"]
ignore = ["E501", "B008", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107"]
"zipline_engine/config.py" = ["S105"]
"zipline_engine/robinhood/client.py" = ["N815"]  # field names mirror Robinhood's JSON exactly
"zipline_engine/core/money.py" = ["N802"]        # D() is the conventional Decimal shorthand

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
no_implicit_optional = true
exclude = ["alembic/", "build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
