name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zipline
          POSTGRES_PASSWORD: zipline
          POSTGRES_DB: zipline
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U zipline -d zipline"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: services/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/engine/pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Create test database
        run: PGPASSWORD=zipline psql -h localhost -U zipline -d zipline -c "CREATE DATABASE zipline_test"
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy zipline_engine
      - name: Tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://zipline:zipline@localhost:5432/zipline_test
          ETH_USD_PRICE_SOURCE: none
        run: pytest -q -p no:warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          ENGINE_URL: http://localhost:8000
